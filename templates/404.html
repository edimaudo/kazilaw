{% extends "base.html" %}

{% block title %}{{ t["not_found_title"] }}{% endblock %}
{% block head_extra %}<meta http-equiv="refresh" content="5;url=/">{% endblock %}

{% block content %}
<div class="bg-[#002147] min-h-[70vh] flex items-center justify-center text-center px-6">
    <div>
        <h1 class="text-6xl md:text-8xl font-extrabold text-white mb-4" data-i18n="not_found_heading">{{ t["not_found_heading"] }}</h1>
        <h2 class="text-3xl font-bold mb-6 text-white" data-i18n="not_found_subheading">{{ t["not_found_subheading"] }}</h2>
        <p class="text-gray-300 mb-8 max-w-md mx-auto" data-i18n="not_found_message">{{ t["not_found_message"] }}</p>
        <a href="/" class="text-[#D4AF37] font-bold border-b-2 border-[#D4AF37] hover:opacity-70 transition" data-i18n="home">{{ t["home"] }}</a>
    </div>
</div>
{% endblock %}
