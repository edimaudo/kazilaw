{% extends "base.html" %}

{% block title %}{{ t["audit_title"] }} | kazilaw{% endblock %}

{% block content %}
<div class="min-h-screen py-12 px-6 transition-colors duration-300">
    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold mb-2" data-i18n="audit_title">{{ t["audit_title"] }}</h2>
        <p class="opacity-80 mb-8"><span data-i18n="audit_intro_prefix">{{ t["audit_intro_prefix"] }}</span> <span id="dynamic-province-text">{{ t["provinces"]["ON"] }}</span><span data-i18n="audit_intro_suffix">{{ t["audit_intro_suffix"] }}</span></p>

        <div class="bg-[var(--bg-card)] p-1 shadow-2xl border border-[var(--border-color)] transition-colors duration-300">
            <div class="flex border-b border-[var(--border-color)] bg-black/5 dark:bg-white/5">
                <button id="tab-file-btn" data-i18n="full_document" onclick="showTab('file')" class="py-4 px-8 border-b-2 border-gold font-bold text-[var(--text-primary)] transition-all">{{ t["full_document"] }}</button>
                <button id="tab-section-btn" data-i18n="specific_clause" onclick="showTab('section')" class="py-4 px-8 text-gray-400 hover:text-[var(--text-primary)] border-b-2 border-transparent transition-all">{{ t["specific_clause"] }}</button>
            </div>

            <div class="p-6 md:p-8 text-[var(--text-primary)]">
                <form id="auditForm" enctype="multipart/form-data">
                    <div id="file-upload" class="py-4">
                        <label for="contractFile" class="block text-sm font-bold mb-4 uppercase tracking-wider" data-i18n="upload_contract">{{ t["upload_contract"] }}</label>
                        <input type="file" id="contractFile" name="file" accept=".pdf,.doc,.docx" class="block w-full text-sm text-gray-400 file:mr-4 file:py-3 file:px-6 file:border-0 file:text-sm file:font-bold file:bg-gold file:text-[#002147] hover:file:bg-opacity-90 cursor-pointer rounded">
                    </div>

                    <div id="section-review" class="py-4 hidden">
                        <label id="clause-label" for="clause-text" class="block text-sm font-bold mb-2 uppercase tracking-wider" data-i18n="paste_contract_text">{{ t["paste_contract_text"] }}</label>
                        <textarea id="clause-text" name="clause_text" aria-labelledby="clause-label" class="w-full h-48 p-4 border border-[var(--border-color)] bg-[var(--bg-primary)] text-[var(--text-primary)] outline-none focus:border-gold transition" data-i18n-placeholder="clause_placeholder" placeholder="{{ t['clause_placeholder'] }}"></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-core-action w-full py-4 flex justify-center items-center gap-2">
                        <span id="btnText" data-i18n="run_review">{{ t["run_review"] }}</span>
                        <div id="spinner" class="hidden animate-spin h-5 w-5 border-2 border-[#002147] border-t-transparent rounded-full" aria-hidden="true"></div>
                    </button>
                </form>

                <div id="resultContainer" class="hidden mt-10">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-bold uppercase text-sm border-l-4 border-gold pl-3" data-i18n="analysis_drafts">{{ t["analysis_drafts"] }}</h3>
                        <button type="button" onclick="copyResults()" class="text-xs font-bold border-2 border-gold text-gold px-4 py-2 hover:bg-gold hover:text-[#002147] transition rounded" data-i18n="copy_all">{{ t["copy_all"] }}</button>
                    </div>
                    <div id="analysisOutput" class="legal-markdown-content p-6 bg-[var(--bg-primary)] text-[var(--text-primary)] leading-relaxed whitespace-pre-wrap border border-[var(--border-color)] italic rounded"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const I18N = window.kazilawI18n;

function showTab(tab) {
    const fileDiv = document.getElementById('file-upload');
    const sectionDiv = document.getElementById('section-review');
    const fileBtn = document.getElementById('tab-file-btn');
    const sectionBtn = document.getElementById('tab-section-btn');
    if (tab === 'file') {
        fileDiv.classList.remove('hidden');
        sectionDiv.classList.add('hidden');
        fileBtn.className = "py-4 px-8 border-b-2 border-gold font-bold text-[var(--text-primary)] transition-all";
        sectionBtn.className = "py-4 px-8 text-gray-400 hover:text-[var(--text-primary)] border-b-2 border-transparent transition-all";
    } else {
        fileDiv.classList.add('hidden');
        sectionDiv.classList.remove('hidden');
        sectionBtn.className = "py-4 px-8 border-b-2 border-gold font-bold text-[var(--text-primary)] transition-all";
        fileBtn.className = "py-4 px-8 text-gray-400 hover:text-[var(--text-primary)] border-b-2 border-transparent transition-all";
    }
}

document.getElementById('auditForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const resultContainer = document.getElementById('resultContainer');
    const output = document.getElementById('analysisOutput');
    submitBtn.disabled = true;
    window.kazilawRawResult = null;
    btnText.innerText = I18N.processing_context;
    spinner.classList.remove('hidden');
    output.innerHTML = '';
    resultContainer.classList.add('hidden');

    const formData = new FormData(e.target);
    const provinceDropdown = document.getElementById('province-select');
    const activeProvince = provinceDropdown ? provinceDropdown.value : (localStorage.getItem('preferred-province') || 'ON');
    formData.set('province', activeProvince);
    formData.set('language', window.kazilawLanguage);

    try {
        const response = await fetch('/audit', { method: 'POST', body: formData });
        if (!response.ok) throw new Error('API Failure');
        const data = await response.json();
        if (data.answer) {
            window.kazilawRawResult = data.answer;
            output.innerHTML = marked.parse(data.answer);
        } else {
            window.kazilawRawResult = null;
            output.innerHTML = `<p>${I18N.no_analysis}</p>`;
        }
        resultContainer.classList.remove('hidden');
        resultContainer.scrollIntoView({ behavior: 'smooth' });
        e.target.reset();
    } catch (error) {
        output.innerHTML = `<p class='text-red-500 font-bold'>${I18N.critical_error}</p>`;
        resultContainer.classList.remove('hidden');
    } finally {
        submitBtn.disabled = false;
        btnText.innerText = I18N.run_review;
        spinner.classList.add('hidden');
    }
});

function copyResults() {
    const text = document.getElementById('analysisOutput').innerText;
    navigator.clipboard.writeText(text).then(() => window.alert(I18N.copy_success));
}
</script>
{% endblock %}
