<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}kazilaw{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { 
            --navy: #002147; 
            --gold: #D4AF37; 
            --gold-hover: #B8962E;
            
            /* Light Mode (Accessible High Contrast Defaults) */
            --bg-primary: #F5F5F5;      /* Off-white canvas instead of blinding pure white */
            --text-primary: #002147;    /* Deep navy readable text */
            --bg-card: #ffffff;         /* Pure white container surfaces */
            --border-color: #D4AF37;    /* Gold accents for structures */
        }

        .dark-theme {
            /* Dark Mode */
            --bg-primary: #002147;      /* Classic deep navy theme background */
            --text-primary: #ffffff;    /* Crisp white text */
            --bg-card: #112240;         /* Slightly lighter navy panel surfaces */
            --border-color: #D4AF37;    /* Gold structural borders */
        }

        .font-size-small { font-size: 14px; }
        .font-size-medium { font-size: 16px; }
        .font-size-large { font-size: 19px; }

        body { 
            font-family: 'Century Schoolbook', 'Montserrat', 'Lato', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s, font-size 0.2s;
        }

        /* Enforce structured high-contrast styling across buttons */
        .btn-core-action {
            background-color: var(--gold) !important;
            color: #002147 !important; /* Always readable dark navy text on gold */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }
        .btn-core-action:hover {
            background-color: var(--gold-hover) !important;
            transform: translateY(-1px);
        }

        *:focus-visible {
            outline: 3px solid var(--gold) !important;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen font-size-medium">
    
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:p-4 focus:bg-white focus:text-[#002147] focus:z-50 border-2 border-gold">
        Skip to main content
    </a>

<nav class="sticky top-0 z-50 bg-white border-b border-gray-200 text-[#002147]">
    <div class="max-w-7xl mx-auto px-4 md:px-6">
        <div class="min-h-16 py-3 flex flex-wrap items-center justify-between gap-y-3">

            <!-- Brand -->
            <a href="/"
               class="text-2xl font-bold tracking-tighter shrink-0"
               aria-label="onllaw Home">
                onllaw
            </a>

            <!-- Navigation + Controls -->
            <div class="flex flex-wrap items-center justify-end gap-3 md:gap-5">

                <!-- Primary Navigation -->
                <div class="flex items-center gap-3 md:gap-5 text-sm font-semibold">

                    <!-- Q&A -->
                    <a href="/qa"
                       class="px-3 py-2 rounded-md
                              text-[#002147]
                              hover:bg-gray-100
                              hover:text-[#002147]
                              transition duration-200
                              border-b-2 border-[#D4AF37]">
                        Q&A
                    </a>

                    <!-- Contract Review -->
                    <a href="/audit"
                       class="px-4 py-2 rounded-md
                              border border-[#002147]
                              hover:bg-[#002147]
                              hover:text-white
                              transition duration-200">
                        Contract Review
                    </a>

                </div>

                <!-- Divider -->
                <div class="hidden md:block h-6 w-px bg-gray-200"></div>

                <!-- Province -->
                <div class="relative flex items-center">

                    <label for="province-select" class="sr-only">
                        Province
                    </label>

                    <select id="province-select"
                            class="appearance-none
                                   pl-3 pr-9 py-2
                                   min-w-[130px]
                                   text-sm font-semibold
                                   bg-gray-50
                                   border border-gray-300
                                   rounded-md
                                   text-[#002147]
                                   cursor-pointer
                                   hover:bg-gray-100
                                   hover:border-gray-400
                                   focus:outline-none
                                   focus:ring-2
                                   focus:ring-[#D4AF37]
                                   focus:border-[#D4AF37]
                                   transition duration-200">

                        <option value="AB">Alberta</option>
                        <option value="BC">British Columbia</option>
                        <option value="MB">Manitoba</option>
                        <option value="NB">New Brunswick</option>
                        <option value="NL">Newfoundland and Labrador</option>
                        <option value="NS">Nova Scotia</option>
                        <option value="ON" selected>Ontario</option>
                        <option value="PE">Prince Edward Island</option>
                        <option value="QC">Quebec</option>
                        <option value="SK">Saskatchewan</option>

                    </select>

                    <!-- Dropdown Arrow -->
                    <div class="pointer-events-none absolute right-3 top-1/2
                                -translate-y-1/2 text-[#002147]">
                        <svg class="w-4 h-4"
                             fill="none"
                             stroke="currentColor"
                             stroke-width="2"
                             viewBox="0 0 24 24">
                            <path d="M6 9l6 6 6-6"/>
                        </svg>
                    </div>

                </div>

                <!-- Accessibility -->
                <div class="relative">

                    <button id="accessibility-toggle"
                            type="button"
                            onclick="toggleAccessibility()"
                            class="px-3 py-2 text-sm font-bold
                                   border border-gray-300
                                   rounded-md
                                   hover:bg-gray-100
                                   transition duration-200"
                            aria-expanded="false"
                            aria-controls="accessibility-panel"
                            aria-label="Accessibility settings">
                        Aa
                    </button>

                    <!-- Accessibility Panel -->
                    <div id="accessibility-panel"
                         class="hidden absolute right-0 top-full mt-2 w-64 p-4
                                bg-white border border-gray-200 rounded-lg
                                shadow-lg z-50">

                        <div class="text-xs font-bold uppercase
                                    tracking-wider mb-3">
                            Text Size
                        </div>

                        <div class="flex gap-2">

                            <button onclick="changeFontSize('small')"
                                    class="flex-1 px-2 py-2 text-xs font-semibold
                                           bg-white border border-gray-300
                                           rounded hover:bg-gray-100">
                                Small
                            </button>

                            <button onclick="changeFontSize('medium')"
                                    class="flex-1 px-2 py-2 text-sm font-bold
                                           bg-white border border-gray-300
                                           rounded hover:bg-gray-100">
                                Medium
                            </button>

                            <button onclick="changeFontSize('large')"
                                    class="flex-1 px-2 py-2 text-base font-black
                                           bg-white border border-gray-300
                                           rounded hover:bg-gray-100">
                                Large
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Theme Toggle -->
                <button id="theme-toggle"
                        type="button"
                        onclick="toggleTheme()"
                        class="px-3 py-2 text-sm font-semibold
                               bg-[#002147] text-white
                               rounded-md
                               hover:opacity-90
                               transition duration-200"
                        aria-label="Toggle light and dark theme">
                    ☀ Light
                </button>

            </div>
        </div>
    </div>
</nav>

<script>
    function toggleAccessibility() {
        const panel = document.getElementById('accessibility-panel');
        const button = document.getElementById('accessibility-toggle');

        const isHidden = panel.classList.contains('hidden');

        panel.classList.toggle('hidden');
        button.setAttribute('aria-expanded', isHidden);
    }

    function changeFontSize(size) {
        document.documentElement.classList.remove(
            'text-size-small',
            'text-size-medium',
            'text-size-large'
        );

        document.documentElement.classList.add(`text-size-${size}`);
    }

    function toggleTheme() {
        const html = document.documentElement;
        const button = document.getElementById('theme-toggle');

        html.classList.toggle('dark');

        const isDark = html.classList.contains('dark');

        button.textContent = isDark ? '☾ Dark' : '☀ Light';
    }
</script>

    <main class="flex-grow" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-[#002147] text-white py-12 px-6 border-t border-gray-700">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm opacity-70">© 2026 kazilaw. Legal info only, not legal advice.</p>
        </div>
    </footer>

<script>
    function updateThemeButtonText(isDark) {
        const themeBtn = document.getElementById('theme-toggle');
        if (themeBtn) {
            themeBtn.innerText = isDark ? "Theme: Dark" : "Theme: Light";
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const path = window.location.pathname;
        
        // FIX: Define dropdown right away so the lines below can safely reference it
        const dropdown = document.getElementById('province-select');

        // 1. Hide the province container on index.html
        if (path === '/' || path.endsWith('index.html') || path === '') {
            const container = document.getElementById('province-selector-container');
            if (container) container.style.setProperty('display', 'none', 'important');
        }
        
        // 2. Rehydrate font size settings
        const savedSize = localStorage.getItem('preferred-font-size');
        if (savedSize) changeFontSize(savedSize);

        // 3. Rehydrate theme preference
        const savedTheme = localStorage.getItem('preferred-theme');
        const isDark = savedTheme === 'dark';
        
        if (isDark && !(path === '/' || path.endsWith('index.html') || path === '')) {
            document.documentElement.classList.add('dark-theme');
            updateThemeButtonText(true);
        } else {
            updateThemeButtonText(false);
        }

        // 4. PERSISTENCE: Restore the user's saved province selection
        const savedProvince = localStorage.getItem('preferred-province');
        if (dropdown && savedProvince) {
            dropdown.value = savedProvince;
        }
        
        // 5. Set up change listeners on the selection field
        if (dropdown) {
            dropdown.addEventListener('change', updatePageProvinceText);
        }
        
        // 6. DELAY FIX: Sync wording safely after block markup layout structures settle
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(updatePageProvinceText, 1);
        } else {
            window.addEventListener('load', updatePageProvinceText);
        }
    });

    function changeFontSize(size) {
        document.body.classList.remove('font-size-small', 'font-size-medium', 'font-size-large');
        document.body.classList.add(`font-size-${size}`);
        localStorage.setItem('preferred-font-size', size);
    }

    function toggleTheme() {
        const path = window.location.pathname;
        if (path === '/' || path.endsWith('index.html') || path === '') return;
        
        const isDark = document.documentElement.classList.toggle('dark-theme');
        localStorage.setItem('preferred-theme', isDark ? 'dark' : 'light');
        updateThemeButtonText(isDark);
    }

    // Function to update the page prose text based on what is selected
    function updatePageProvinceText() {
        const dropdown = document.getElementById('province-select');
        const dynamicTextSpan = document.getElementById('dynamic-province-text');
        
        if (dropdown) {
            // Save the selection code (e.g. "BC", "ON") to localStorage
            localStorage.setItem('preferred-province', dropdown.value);
            
            // If the current page contains our text hook, swap the wording
            if (dynamicTextSpan) {
                const selectedProvinceName = dropdown.options[dropdown.selectedIndex].text;
                dynamicTextSpan.innerText = selectedProvinceName;
            }
        }
    }
</script>
</body>
</html>
