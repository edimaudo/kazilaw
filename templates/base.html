<!DOCTYPE html>
<html lang="{{ html_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}kazilaw{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { 
            --navy: #002147; 
            --gold: #D4AF37; 
            --gold-hover: #B8962E;
            
            /* Light Mode (Accessible High Contrast Defaults) */
            --bg-primary: #F5F5F5;      /* Off-white canvas instead of blinding pure white */
            --text-primary: #002147;    /* Deep navy readable text */
            --bg-card: #ffffff;         /* Pure white container surfaces */
            --border-color: #D4AF37;    /* Gold accents for structures */
        }

        .dark-theme {
            /* Dark Mode */
            --bg-primary: #002147;      /* Classic deep navy theme background */
            --text-primary: #ffffff;    /* Crisp white text */
            --bg-card: #112240;         /* Slightly lighter navy panel surfaces */
            --border-color: #D4AF37;    /* Gold structural borders */
        }

        .font-size-small { font-size: 14px; }
        .font-size-medium { font-size: 16px; }
        .font-size-large { font-size: 19px; }

        body { 
            font-family: 'Century Schoolbook', 'Montserrat', 'Lato', sans-serif; 
            background-color: var(--bg-primary); 
            color: var(--text-primary);
            transition: background-color 0.2s, color 0.2s, font-size 0.2s;
        }

        /* Enforce structured high-contrast styling across buttons */
        .btn-core-action {
            background-color: var(--gold) !important;
            color: #002147 !important; /* Always readable dark navy text on gold */
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.2s ease;
        }
        .btn-core-action:hover {
            background-color: var(--gold-hover) !important;
            transform: translateY(-1px);
        }

        *:focus-visible {
            outline: 3px solid var(--gold) !important;
            outline-offset: 2px;
        }

        .legal-markdown-content h3 {
        font-size: 1.15rem;
        font-weight: 700;
        text-transform: uppercase;
        margin-top: 1.5rem;
        margin-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color, #e5e7eb);
        padding-bottom: 0.25rem;
        color: var(--text-primary);
    }
    .legal-markdown-content p {
        margin-bottom: 1rem;
        line-height: 1.6;
    }
    .legal-markdown-content ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
    }
    .legal-markdown-content li {
        margin-bottom: 0.25rem;
    }
    .legal-markdown-content strong {
        font-weight: 700;
    }
    .legal-markdown-content em {
        font-style: italic;
        opacity: 0.85;
    }
    </style>
    {% block head_extra %}{% endblock %}
    <script>
        window.kazilawAllTranslations = {{ all_translations | tojson }};
        window.kazilawLanguage = {{ language | tojson }};
        window.kazilawI18n = Object.assign({}, window.kazilawAllTranslations[window.kazilawLanguage]);
    </script>
</head>
    
<body class="flex flex-col min-h-screen font-size-medium" data-title-key="{{ page_title_key }}">
    
    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:p-4 focus:bg-white focus:text-[#002147] focus:z-50 border-2 border-gold" data-i18n="skip_to_main">
        {{ t["skip_to_main"] }}
    </a>

<nav class="sticky top-0 z-50 bg-white border-b border-gray-200 text-[#002147]">
    <div class="max-w-7xl mx-auto px-4 md:px-6">
        <div class="min-h-16 py-3 flex flex-wrap items-center justify-between gap-y-3">

            <!-- Brand -->
            <a href="/"
               class="text-2xl font-bold tracking-tighter shrink-0"
               aria-label="{{ t['home'] }}" data-i18n-aria-label="home">
                kazilaw
            </a>
            {% if request.path != '/' %}
            <!-- Navigation + Controls -->
            <div class="flex flex-wrap items-center justify-end gap-3 md:gap-5">

                <!-- Primary Navigation -->
                <div class="flex items-center gap-1 text-sm font-semibold">

                    <!-- Contract Review -->
                    <a href="/audit" data-i18n="contract_review"
                       class="px-3 py-2 rounded-md transition duration-200
                              hover:bg-gray-100
                              {% if request.path == '/audit' %}
                              bg-gray-100 text-[#002147]
                              {% else %}
                              text-[#002147]
                              {% endif %}">
                        {{ t["contract_review"] }}
                    </a>
                    
                    <!-- Q&A -->
                    <a href="/qa" data-i18n="qa"
                       class="px-3 py-2 rounded-md transition duration-200
                              hover:bg-gray-100
                              {% if request.path == '/qa' %}
                              bg-gray-100 text-[#002147]
                              {% else %}
                              text-[#002147]
                              {% endif %}">
                        {{ t["qa"] }}
                    </a>



                </div>

                <!-- Divider -->
                <div class="hidden md:block h-6 w-px bg-gray-200"></div>

                <!-- Province -->
                <div class="relative flex items-center">

                    <label for="province-select" class="sr-only" data-i18n="province">
                        {{ t["province"] }}
                    </label>

                    <select id="province-select"
                            class="appearance-none
                                   pl-3 pr-8 py-2
                                   min-w-[125px]
                                   text-sm font-semibold
                                   bg-white
                                   border border-gray-300
                                   rounded-md
                                   text-[#002147]
                                   cursor-pointer
                                   hover:bg-gray-50
                                   focus:outline-none
                                   transition duration-200">

                        <option data-i18n-province="AB" value="AB">{{ t["provinces"]["AB"] }}</option>
                        <option data-i18n-province="BC" value="BC">{{ t["provinces"]["BC"] }}</option>
                        <option data-i18n-province="MB" value="MB">{{ t["provinces"]["MB"] }}</option>
                        <option data-i18n-province="NB" value="NB">{{ t["provinces"]["NB"] }}</option>
                        <option data-i18n-province="NL" value="NL">{{ t["provinces"]["NL"] }}</option>
                        <option data-i18n-province="NS" value="NS">{{ t["provinces"]["NS"] }}</option>
                        <option data-i18n-province="ON" value="ON" selected>{{ t["provinces"]["ON"] }}</option>
                        <option data-i18n-province="PE" value="PE">{{ t["provinces"]["PE"] }}</option>
                        <option data-i18n-province="QC" value="QC">{{ t["provinces"]["QC"] }}</option>
                        <option data-i18n-province="SK" value="SK">{{ t["provinces"]["SK"] }}</option>
                        <option data-i18n-province="NT" value="NT">{{ t["provinces"]["NT"] }}</option>
                        <option data-i18n-province="NU" value="NU">{{ t["provinces"]["NU"] }}</option>
                        <option data-i18n-province="YT" value="YT">{{ t["provinces"]["YT"] }}</option>

                    </select>

                    <!-- Dropdown Arrow -->
                    <svg class="pointer-events-none absolute right-2.5
                                w-4 h-4 text-gray-500"
                         fill="none"
                         stroke="currentColor"
                         stroke-width="2"
                         viewBox="0 0 24 24">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>

                </div>

                <!-- Language -->
                <div class="relative flex items-center">
                    <label for="language-select" class="sr-only" data-i18n="language">{{ t["language"] }}</label>
                    <select id="language-select" aria-label="{{ t['language'] }}" data-i18n-aria-label="language" data-i18n-aria-label="language"
                            class="appearance-none pl-3 pr-8 py-2 min-w-[72px] text-sm font-semibold bg-white border border-gray-300 rounded-md text-[#002147] cursor-pointer hover:bg-gray-50 focus:outline-none transition duration-200">
                        <option value="en" {% if language == 'en' %}selected{% endif %}>EN</option>
                        <option value="fr" {% if language == 'fr' %}selected{% endif %}>FR</option>
                    </select>
                    <svg class="pointer-events-none absolute right-2.5 w-4 h-4 text-gray-500" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </div>

                <!-- Accessibility -->
                <div class="relative">

                    <button id="accessibility-toggle" data-i18n-aria-label="accessibility_settings"
                            type="button"
                            onclick="toggleAccessibility()"
                            class="px-3 py-2 text-sm font-bold
                                   border border-gray-300
                                   rounded-md
                                   hover:bg-gray-100
                                   transition duration-200"
                            aria-expanded="false"
                            aria-controls="accessibility-panel"
                            aria-label="{{ t['accessibility_settings'] }}" data-i18n-aria-label="accessibility_settings">
                        Aa
                    </button>

                    <!-- Accessibility Panel -->
                    <div id="accessibility-panel"
                         class="hidden absolute right-0 top-full mt-2 w-64 p-4
                                bg-white border border-gray-200 rounded-lg
                                shadow-lg z-50">

                        <div class="text-xs font-bold uppercase
                                    tracking-wider mb-3" data-i18n="text_size">
                            {{ t["text_size"] }}
                        </div>

                        <div class="flex gap-2">

                            <button onclick="changeFontSize('small')"
                                    class="flex-1 px-2 py-2 text-xs font-semibold
                                           bg-white border border-gray-300
                                           rounded hover:bg-gray-100" data-i18n="small">
                                {{ t["small"] }}
                            </button>

                            <button onclick="changeFontSize('medium')"
                                    class="flex-1 px-2 py-2 text-sm font-bold
                                           bg-white border border-gray-300
                                           rounded hover:bg-gray-100" data-i18n="medium">
                                {{ t["medium"] }}
                            </button>

                            <button onclick="changeFontSize('large')"
                                    class="flex-1 px-2 py-2 text-base font-black
                                           bg-white border border-gray-300
                                           rounded hover:bg-gray-100" data-i18n="large">
                                {{ t["large"] }}
                            </button>

                        </div>

                    </div>

                </div>

                <!-- Theme Toggle -->
                <button id="theme-toggle"
                        type="button"
                        onclick="toggleTheme()"
                        class="px-3 py-2 text-sm font-semibold
                               bg-[#002147] text-white
                               rounded-md
                               hover:opacity-90
                               transition duration-200"
                        aria-label="{{ t['toggle_theme'] }}" data-i18n-aria-label="toggle_theme">
                    ☀ {{ t["light"] }}
                </button>

            </div>
            {% endif %}
        </div>
    </div>
</nav>

    <main class="flex-grow" id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-[#002147] text-white py-12 px-6 border-t border-gray-700">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <p class="text-sm opacity-70">© 2026 kazilaw. <span data-i18n="footer_disclaimer">{{ t["footer_disclaimer"] }}</span></p>
        </div>
    </footer>


    <script>
    const app = {
        get path() {
            return window.location.pathname;
        },

        get isHomePage() {
            return this.path === '/' ||
                   this.path.endsWith('index.html') ||
                   this.path === '';
        }
    };

    function toggleAccessibility() {
        const panel = document.getElementById('accessibility-panel');
        const button = document.getElementById('accessibility-toggle');

        if (!panel || !button) return;

        const isHidden = panel.classList.contains('hidden');

        panel.classList.toggle('hidden');
        button.setAttribute('aria-expanded', String(isHidden));
    }

    function changeFontSize(size) {
        document.body.classList.remove(
            'font-size-small',
            'font-size-medium',
            'font-size-large'
        );

        document.body.classList.add(`font-size-${size}`);
        localStorage.setItem('preferred-font-size', size);
    }

    function updateThemeButton(isDark) {
        const button = document.getElementById('theme-toggle');

        if (!button) return;

        button.textContent = isDark
            ? `☾ ${window.kazilawI18n.dark}`
            : `☀ ${window.kazilawI18n.light}`;
    }

    function toggleTheme() {
        if (app.isHomePage) return;

        const isDark = document.documentElement.classList.toggle('dark-theme');

        localStorage.setItem(
            'preferred-theme',
            isDark ? 'dark' : 'light'
        );

        updateThemeButton(isDark);
    }

    function updatePageProvinceText() {
        const dropdown = document.getElementById('province-select');
        const dynamicText = document.getElementById('dynamic-province-text');

        if (!dropdown) return;

        localStorage.setItem(
            'preferred-province',
            dropdown.value
        );

        if (dynamicText) {
            dynamicText.textContent =
                dropdown.options[dropdown.selectedIndex].text;
        }
    }

    function applyLanguage(language) {
        const selected = language === 'fr' ? 'fr' : 'en';
        const dictionary = window.kazilawAllTranslations[selected];
        window.kazilawLanguage = selected;
        Object.assign(window.kazilawI18n, dictionary);
        document.documentElement.lang = selected === 'fr' ? 'fr-CA' : 'en-CA';

        document.querySelectorAll('[data-i18n]').forEach((element) => {
            const key = element.dataset.i18n;
            if (Object.prototype.hasOwnProperty.call(dictionary, key)) element.textContent = dictionary[key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach((element) => {
            const key = element.dataset.i18nPlaceholder;
            if (dictionary[key] !== undefined) element.setAttribute('placeholder', dictionary[key]);
        });
        document.querySelectorAll('[data-i18n-aria-label]').forEach((element) => {
            const key = element.dataset.i18nAriaLabel;
            if (dictionary[key] !== undefined) element.setAttribute('aria-label', dictionary[key]);
        });
        document.querySelectorAll('[data-i18n-province]').forEach((element) => {
            const code = element.dataset.i18nProvince;
            if (dictionary.provinces[code] !== undefined) element.textContent = dictionary.provinces[code];
        });

        const titleKey = document.body.dataset.titleKey;
        if (titleKey && dictionary[titleKey]) {
            document.title = titleKey === 'landing_meta_title' || titleKey === 'not_found_title'
                ? dictionary[titleKey]
                : `${dictionary[titleKey]} | kazilaw`;
        }
        updateThemeButton(document.documentElement.classList.contains('dark-theme'));
        updatePageProvinceText();
    }

    async function setLanguage(language) {
        const selected = language === 'fr' ? 'fr' : 'en';
        if (selected === window.kazilawLanguage) return;
        document.cookie = `kazilaw_language=${selected}; Path=/; Max-Age=31536000; SameSite=Lax`;
        applyLanguage(selected);

        const output = document.getElementById('analysisOutput') || document.getElementById('answerArea');
        const container = document.getElementById('resultContainer');
        const source = window.kazilawRawResult;
        if (output && container && !container.classList.contains('hidden') && source) {
            const previousHtml = output.innerHTML;
            const requestId = (window.kazilawTranslationRequestId || 0) + 1;
            window.kazilawTranslationRequestId = requestId;
            output.textContent = window.kazilawI18n.translating_result;
            const payload = new FormData();
            payload.append('text', source);
            payload.append('language', selected);
            try {
                const response = await fetch('/translate-result', { method: 'POST', body: payload });
                if (!response.ok) throw new Error('Translation request failed');
                const data = await response.json();
                if (requestId !== window.kazilawTranslationRequestId) return;
                if (data.answer) {
                    window.kazilawRawResult = data.answer;
                    output.innerHTML = marked.parse(data.answer);
                } else {
                    output.innerHTML = previousHtml;
                }
            } catch (error) {
                if (requestId === window.kazilawTranslationRequestId) {
                    output.innerHTML = previousHtml;
                    window.alert(window.kazilawI18n.result_translation_error);
                }
                console.error('Could not translate the displayed result:', error);
            }
        }
    }

    function initializeApp() {
        const dropdown = document.getElementById('province-select');
        const languageDropdown = document.getElementById('language-select');

        if (languageDropdown) {
            languageDropdown.addEventListener('change', () => setLanguage(languageDropdown.value));
        }

        // Restore font size
        const savedSize = localStorage.getItem('preferred-font-size');

        if (savedSize) {
            changeFontSize(savedSize);
        }

        // Restore theme
        const savedTheme = localStorage.getItem('preferred-theme');
        const isDark = savedTheme === 'dark';

        if (isDark && !app.isHomePage) {
            document.documentElement.classList.add('dark-theme');
        }

        updateThemeButton(
            isDark && !app.isHomePage
        );

        // Restore province
        const savedProvince =
            localStorage.getItem('preferred-province');

        if (dropdown && savedProvince) {
            dropdown.value = savedProvince;
        }

        // Listen for province changes
        if (dropdown) {
            dropdown.addEventListener(
                'change',
                updatePageProvinceText
            );

            updatePageProvinceText();
        }
    }

    document.addEventListener(
        'DOMContentLoaded',
        initializeApp
    );
</script>
</body>
</html>
