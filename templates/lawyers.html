{% extends "base.html" %}

{% block title %}{{ t["lawyers_title"] }} | kazilaw{% endblock %}

{% block content %}
<section class="min-h-screen bg-[var(--bg-primary)] text-[var(--text-primary)] transition-colors duration-200">
    <div class="max-w-6xl mx-auto px-6 py-10 md:py-12">
        <header class="mb-8 border-b border-[var(--border-color)] pb-6">
            <h1 class="text-3xl md:text-4xl font-bold tracking-tight mb-3" data-i18n="lawyers_title">{{ t["lawyers_title"] }}</h1>
            <p class="text-base md:text-lg leading-relaxed text-[var(--text-muted)]" data-i18n="lawyers_subtitle">{{ t["lawyers_subtitle"] }}</p>
        </header>

        <div id="lawyer-directory" aria-live="polite" aria-busy="true">
            <p id="lawyer-loading" class="py-4 text-sm text-[var(--text-muted)]">
                {% if language == 'fr' %}Chargement du répertoire juridique…{% else %}Loading legal directory…{% endif %}
            </p>
        </div>
    </div>
</section>

<script>
(() => {
    const root = document.getElementById('lawyer-directory');
    if (!root) return;

    const CLIENT_CACHE_TTL_MS = 5 * 60 * 1000;
    const directoryCache = new Map();
    let latestRequestId = 0;
    let scheduledLoad = false;

    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[char]));

    const getSelectedProvince = () => {
        const dropdown = document.getElementById('province-select');
        const selected = dropdown && dropdown.value;
        return (selected || localStorage.getItem('preferred-province') || 'ON').toUpperCase();
    };

    const getSelectedLanguage = () => {
        const dropdown = document.getElementById('language-select');
        const selected = (dropdown && dropdown.value) || window.kazilawLanguage || 'en';
        return String(selected).toLowerCase().startsWith('fr') ? 'fr' : 'en';
    };

    const cacheKey = (province, language) => `${province}:${language}`;

    function scheduleDirectoryLoad() {
        if (scheduledLoad) return;
        scheduledLoad = true;
        window.setTimeout(() => {
            scheduledLoad = false;
            loadDirectory();
        }, 0);
    }

    async function loadDirectory() {
        const requestId = ++latestRequestId;
        const province = getSelectedProvince();
        const language = getSelectedLanguage();
        const key = cacheKey(province, language);
        const now = Date.now();
        const cached = directoryCache.get(key);

        // Render a recent result immediately when the same province/language is revisited.
        if (cached && now - cached.savedAt < CLIENT_CACHE_TTL_MS) {
            root.innerHTML = renderDirectory(cached.data);
            root.setAttribute('aria-busy', 'false');
            return;
        }

        root.setAttribute('aria-busy', 'true');
        root.innerHTML = `<p class="py-4 text-sm text-[var(--text-muted)]">${escapeHtml(language === 'fr' ? 'Chargement du répertoire juridique…' : 'Loading legal directory…')}</p>`;

        try {
            const response = await fetch(`/api/lawyers?province=${encodeURIComponent(province)}&language=${encodeURIComponent(language)}`, {
                headers: { 'Accept': 'application/json' },
                cache: 'no-store'
            });
            if (!response.ok) throw new Error(`Directory request failed (${response.status})`);
            const data = await response.json();

            // Ignore late responses after a user has selected another province or language.
            if (requestId !== latestRequestId) return;
            if (province !== getSelectedProvince() || language !== getSelectedLanguage()) {
                scheduleDirectoryLoad();
                return;
            }

            directoryCache.set(key, { data, savedAt: Date.now() });
            root.innerHTML = renderDirectory(data);
        } catch (error) {
            if (requestId !== latestRequestId) return;
            const message = language === 'fr'
                ? 'Impossible de charger le répertoire pour le moment. Utilisez le lien du barreau ci-dessous pour consulter les inscriptions.'
                : 'The directory could not be loaded right now. Use the law-society directory link below to check current listings.';
            root.innerHTML = `<p class="py-4 text-sm leading-relaxed text-[var(--text-muted)]">${escapeHtml(message)}</p>`;
            console.error('Lawyer directory could not be loaded:', error);
        } finally {
            if (requestId === latestRequestId) root.setAttribute('aria-busy', 'false');
        }
    }

    function renderDirectory(data) {
        const messages = data.messages || {};
        const lawyers = Array.isArray(data.lawyers) ? data.lawyers : [];
        const language = data.language === 'fr' ? 'fr' : 'en';

        const sourceLinks = `
            <div class="mb-6 flex flex-wrap gap-x-6 gap-y-2 text-sm font-semibold">
                <a class="text-[var(--text-primary)] underline underline-offset-4 hover:text-[var(--gold)]" href="${escapeHtml(data.regulator_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(data.regulator_name)} <span aria-hidden="true">↗</span></a>
                <a class="text-[var(--text-primary)] underline underline-offset-4 hover:text-[var(--gold)]" href="${escapeHtml(data.practice_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(data.practice_name)} <span aria-hidden="true">↗</span></a>
            </div>`;

        const results = lawyers.length
            ? `<div class="divide-y divide-[var(--border-color)] border-y border-[var(--border-color)]">
                ${lawyers.map((lawyer) => `
                    <article class="flex flex-col gap-3 py-4 md:flex-row md:items-center md:justify-between md:py-5">
                        <div class="min-w-0">
                            <h3 class="text-lg font-semibold">${escapeHtml(lawyer.name)}</h3>
                            ${lawyer.firm ? `<p class="mt-1 text-sm">${escapeHtml(lawyer.firm)}</p>` : ''}
                            ${lawyer.city ? `<p class="mt-1 text-sm text-[var(--text-muted)]">${escapeHtml(lawyer.city)}</p>` : ''}
                        </div>
                        <div class="flex shrink-0 flex-wrap items-center gap-x-5 gap-y-2 text-sm">
                            ${lawyer.profile_url ? `<a class="underline underline-offset-4 hover:text-[var(--gold)]" href="${escapeHtml(lawyer.profile_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(messages.view_profile || (language === 'fr' ? 'Voir le profil' : 'View profile'))}</a>` : ''}
                            <a class="underline underline-offset-4 hover:text-[var(--gold)]" href="${escapeHtml(data.regulator_url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(messages.verify_status || (language === 'fr' ? 'Répertoire du barreau' : 'Law-society directory'))}</a>
                        </div>
                    </article>`).join('')}
              </div>`
            : `<div class="border-y border-[var(--border-color)] py-5">
                <p class="text-sm leading-relaxed text-[var(--text-muted)]">${escapeHtml(messages.empty_body || (language === 'fr' ? 'Aucun profil n’est actuellement disponible pour cette sélection. Consultez le répertoire officiel.' : 'No profiles are currently available for this selection. Please use the official directory.'))}</p>
              </div>`;

        return `
            <section>
                ${sourceLinks}
                <h2 class="mb-5 text-2xl font-bold">${escapeHtml(data.province_name || '')}</h2>
                ${results}
            </section>`;
    }

    // Listen directly to the select as well as the shared event, so the directory
    // refreshes even if another page-level handler changes or stops dispatching events.
    const provinceDropdown = document.getElementById('province-select');
    const languageDropdown = document.getElementById('language-select');
    if (provinceDropdown) provinceDropdown.addEventListener('change', scheduleDirectoryLoad);
    if (languageDropdown) languageDropdown.addEventListener('change', scheduleDirectoryLoad);
    document.addEventListener('kazilaw:provincechange', scheduleDirectoryLoad);
    document.addEventListener('kazilaw:languagechange', scheduleDirectoryLoad);
    document.addEventListener('DOMContentLoaded', scheduleDirectoryLoad);
})();
</script>
{% endblock %}
