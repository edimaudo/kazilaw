{% extends "base.html" %}

{% block title %}{{ t["qa_title"] }} | kazilaw{% endblock %}

{% block content %}
<div class="min-h-screen py-12 px-6 transition-colors duration-300">
    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl font-bold mb-2" data-i18n="qa_title">{{ t["qa_title"] }}</h2>
        <p class="opacity-80 mb-8"><span data-i18n="qa_intro_prefix">{{ t["qa_intro_prefix"] }}</span> <span id="dynamic-province-text">{{ t["provinces"]["ON"] }}</span><span data-i18n="qa_intro_suffix">{{ t["qa_intro_suffix"] }}</span></p>

        <div class="bg-[var(--bg-card)] p-6 md:p-8 border border-[var(--border-color)] shadow-sm text-[var(--text-primary)] transition-colors duration-300">
            <form id="qaForm">
                <div class="mb-6">
                    <label for="question" class="block text-sm font-bold mb-2 uppercase tracking-wider" data-i18n="your_inquiry">{{ t["your_inquiry"] }}</label>
                    <textarea id="question" name="question" required class="w-full h-32 p-4 border border-[var(--border-color)] bg-[var(--bg-primary)] text-[var(--text-primary)] shadow-sm outline-none transition legal-text" data-i18n-placeholder="qa_placeholder" placeholder="{{ t['qa_placeholder'] }}"></textarea>
                </div>
                <button type="submit" id="submitBtn" data-i18n="submit_inquiry" class="btn-core-action w-full py-4">{{ t["submit_inquiry"] }}</button>
            </form>

            <div id="resultContainer" class="hidden mt-8 p-6 bg-[var(--bg-primary)] border-t-2 border-yellow-500 rounded">
                <h2 class="font-bold mb-2 uppercase text-sm" data-i18n="legal_summary">{{ t["legal_summary"] }}</h2>
                <div id="answerArea" class="legal-markdown-content legal-text leading-relaxed whitespace-pre-wrap"></div>
            </div>
        </div>
    </div>
</div>

<script>
const I18N = window.kazilawI18n;

document.getElementById('qaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const questionInput = document.getElementById('question');
    const submitBtn = document.getElementById('submitBtn');
    const resultContainer = document.getElementById('resultContainer');
    const answerArea = document.getElementById('answerArea');
    submitBtn.disabled = true;
    window.kazilawRawResult = null;
    submitBtn.innerText = I18N.consulting_law;
    resultContainer.classList.add('hidden');

    try {
        const formData = new FormData();
        formData.append('question', questionInput.value);
        const provinceDropdown = document.getElementById('province-select');
        const activeProvince = provinceDropdown ? provinceDropdown.value : (localStorage.getItem('preferred-province') || 'ON');
        formData.set('province', activeProvince);
        formData.set('language', window.kazilawLanguage);

        const response = await fetch('/qa', { method: 'POST', body: formData });
        if (!response.ok) throw new Error('Network response error');
        const data = await response.json();
        resultContainer.classList.remove('hidden');
        if (data.answer) {
            window.kazilawRawResult = data.answer;
            answerArea.innerHTML = marked.parse(data.answer);
        } else {
            window.kazilawRawResult = null;
            answerArea.innerHTML = `<p>${I18N.no_guidance}</p>`;
        }
    } catch (error) {
        console.error('Error:', error);
        resultContainer.classList.remove('hidden');
        answerArea.innerHTML = `<p class="text-red-500">${I18N.communication_error}</p>`;
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = I18N.submit_inquiry;
    }
});
</script>
{% endblock %}
